{% extends 'base.html' %}
{% block content %}

<div class="form-box">
    <h2>Reset Password</h2>

    <p>Enter your email address and we’ll send you a reset link.</p>

    <form method="POST">
        {% csrf_token %}

        <label>Email</label>
        <input type="email" name="email" required>

        <button class="btn-red" type="submit">Send Reset Link</button>
    </form>
</div>

{% endblock %}
